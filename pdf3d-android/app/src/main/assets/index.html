<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PDF 3D 뷰어</title>
<style>
  :root {
    --bar: #1e293b;
    --bar-2: #273449;
    --ink: #e2e8f0;
    --ink-dim: #94a3b8;
    --bg-top: #d9dee5;
    --bg-bot: #f4f6f8;
    --accent: #ff6a00;
    --teal: #5eead4;
    --panel: #ffffff;
    --line: #e2e8f0;
    --text: #0f172a;
    --text-dim: #64748b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-bot);
    font-family: system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--text);
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* ---------- layout ---------- */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  header { flex: none; display: flex; align-items: center; gap: 4px; height: 52px;
    padding: 0 6px; padding-top: env(safe-area-inset-top); background: var(--bar); color: var(--ink); }
  header h1 { flex: 1; margin: 0 4px; font-size: 16px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .hbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; }
  .hbtn:active { background: rgba(255,255,255,.12); }
  #stage { position: relative; flex: 1; min-height: 0;
    background: linear-gradient(var(--bg-top), var(--bg-bot)); }
  #view { position: absolute; inset: 0; touch-action: none; }
  #view canvas { display: block; width: 100%; height: 100%; }

  /* bottom toolbar */
  #toolbar { flex: none; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
    background: var(--bar); color: var(--ink); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
  #toolbar::-webkit-scrollbar { display: none; }
  .tb { flex: none; min-width: 58px; height: 54px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; border-radius: 10px; font-size: 11px; color: var(--ink); }
  .tb:active { background: rgba(255,255,255,.12); }
  .tb.on { background: var(--bar-2); color: var(--teal); }
  .tb[disabled] { opacity: .35; pointer-events: none; }
  .sep { flex: none; width: 1px; margin: 10px 3px; background: rgba(255,255,255,.15); }

  /* selection chip */
  #selbar { position: absolute; left: 10px; right: 10px; bottom: 10px; display: none;
    align-items: center; gap: 8px; padding: 8px 6px 8px 12px; border-radius: 14px;
    background: rgba(255,255,255,.96); box-shadow: 0 4px 18px rgba(15,23,42,.18); }
  #selbar.show { display: flex; }
  #selbar .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  #selbar .txt { flex: 1; min-width: 0; }
  #selbar .t1 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #selbar .t2 { font-size: 12px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #selbar button { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--text-dim); }
  #selbar button:active { background: #f1f5f9; }

  /* section slider */
  #secpanel { position: absolute; left: 10px; right: 10px; top: 10px; display: none; align-items: center;
    gap: 10px; padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,.96);
    box-shadow: 0 4px 18px rgba(15,23,42,.15); }
  #secpanel.show { display: flex; }
  .seg { display: flex; background: #f1f5f9; border-radius: 9px; padding: 2px; }
  .seg button { width: 34px; height: 30px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--text-dim); }
  .seg button.on { background: #fff; color: #e0413a; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #secslider { flex: 1; accent-color: #e0413a; height: 30px; }
  #secflip { width: 34px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--text-dim); background: #f1f5f9; }

  /* hint toast */
  #toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); max-width: calc(100% - 24px);
    padding: 9px 14px; border-radius: 12px; background: rgba(15,23,42,.88); color: #fff; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s; text-align: center; }
  #toast.show { opacity: 1; }
  #secpanel.show ~ #toast { top: 64px; }

  /* drawer (parts tree) */
  #scrim { position: fixed; inset: 0; background: rgba(15,23,42,.35); opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 10; }
  #scrim.show { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(88vw, 400px); z-index: 11;
    background: var(--panel); transform: translateX(-102%); transition: transform .22s ease;
    display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(15,23,42,.2);
    padding-top: env(safe-area-inset-top); }
  #drawer.show { transform: none; }
  .dhead { display: flex; align-items: center; gap: 6px; padding: 10px 8px 8px 14px; border-bottom: 1px solid var(--line); }
  .dhead b { flex: 1; font-size: 16px; }
  .dhead small { color: var(--text-dim); font-size: 12px; font-weight: 400; margin-left: 6px; }
  .dhead button { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--text-dim); }
  #search { margin: 8px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; outline: none; -webkit-user-select: text; user-select: text; }
  #search:focus { border-color: #94a3b8; }
  .dactions { display: flex; gap: 6px; padding: 0 10px 8px; }
  .dactions button { flex: 1; height: 34px; border-radius: 9px; background: #f1f5f9; font-size: 12px; color: #334155; }
  .dactions button:active { background: #e2e8f0; }
  #tree { flex: 1; overflow-y: auto; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .row { display: flex; align-items: center; min-height: 40px; padding-right: 8px; font-size: 13px;
    border-bottom: 1px solid #f8fafc; }
  .row.sel { background: rgba(255,106,0,.42); font-weight: 700; }
  .row.par { background: rgba(255,106,0,.13); }
  .row .tw { flex: none; width: 28px; height: 40px; display: grid; place-items: center; color: var(--text-dim); }
  .row .tw svg { width: 16px; height: 16px; transition: transform .15s; }
  .row.open > .tw svg { transform: rotate(90deg); }
  .row .ck { flex: none; width: 34px; height: 40px; display: grid; place-items: center; }
  .row .ck span { width: 18px; height: 18px; border-radius: 5px; border: 2px solid #94a3b8; display: grid; place-items: center; }
  .row .ck.on span { background: #334155; border-color: #334155; }
  .row .ck.part span { background: #94a3b8; border-color: #94a3b8; }
  .row .ck span svg { width: 12px; height: 12px; color: #fff; stroke-width: 3; opacity: 0; }
  .row .ck.on span svg { opacity: 1; }
  .row .sw { flex: none; width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .row .nm { flex: 1; min-width: 0; padding: 10px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .ct { flex: none; color: var(--text-dim); font-size: 11px; margin-left: 6px; font-weight: 400; }
  .kids { display: none; }
  .open + .kids { display: block; }

  /* menu sheet */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: #fff;
    border-radius: 18px 18px 0 0; transform: translateY(105%); transition: transform .22s ease;
    padding: 8px 0 calc(10px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; }
  #sheet.show { transform: none; }
  #sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #cbd5e1; margin: 4px auto 10px; }
  #sheet h3 { margin: 10px 18px 6px; font-size: 12px; color: var(--text-dim); font-weight: 600; }
  #sheet .item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 18px; font-size: 15px; text-align: left; }
  #sheet .item:active { background: #f1f5f9; }
  #sheet .item .r { margin-left: auto; color: var(--text-dim); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 18px 6px; }
  .chips button { padding: 8px 14px; border-radius: 18px; background: #f1f5f9; font-size: 13px; }
  .chips button.on { background: #1e293b; color: #fff; }

  /* welcome / loading */
  #welcome { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 24px; color: #475569;
    background: linear-gradient(var(--bg-top), var(--bg-bot)); }
  #welcome .logo { position: absolute; top: 14px; right: 14px; background: #fff; border-radius: 9px; padding: 7px 9px;
    box-shadow: 0 2px 8px rgba(15,23,42,.12); }
  #welcome .logo img { height: 26px; display: block; }
  #welcome .cube { width: 92px; height: 92px; }
  #welcome h2 { margin: 0; font-size: 22px; color: #1e293b; }
  #welcome p { margin: 0; font-size: 14px; line-height: 1.6; }
  #welcome .open { margin-top: 6px; display: flex; align-items: center; gap: 8px; padding: 14px 26px;
    border-radius: 14px; background: #1e293b; color: #fff; font-size: 16px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(30,41,59,.25); }
  #welcome .open:active { transform: scale(.98); }
  #welcome small { color: #94a3b8; font-size: 12px; }
  #loading { position: absolute; inset: 0; display: none; place-items: center; background: rgba(244,246,248,.75); }
  #loading.show { display: grid; }
  .spin { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #cbd5e1; border-top-color: #1e293b;
    animation: sp .8s linear infinite; margin: 0 auto 12px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #loading div div { font-size: 14px; color: #334155; text-align: center; }
  #file { display: none; }
  #view, #view canvas { -webkit-touch-callout: none; }

  /* search result info */
  #searchinfo { display: none; margin: -2px 12px 8px; font-size: 12px; color: var(--text-dim); }
  #searchinfo.show { display: block; }
  .row.hit .nm { color: #b45309; }
  .dactions #searchSelect { background: #fff1e6; color: #c2410c; font-weight: 600; }

  /* confirm dialog */
  #confirm { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(15,23,42,.45); }
  #confirm.show { display: flex; }
  #confirm .card { width: min(340px, 100%); background: #fff; border-radius: 18px; padding: 22px 20px 14px;
    box-shadow: 0 12px 40px rgba(15,23,42,.3); }
  #confirm h4 { margin: 0 0 10px; font-size: 17px; }
  #confirm p { margin: 0 0 18px; font-size: 14px; line-height: 1.55; color: #334155; white-space: pre-line; word-break: keep-all; }
  #confirm .btns { display: flex; gap: 8px; }
  #confirm .btns button { flex: 1; height: 46px; border-radius: 12px; font-size: 15px; font-weight: 600; }
  #cfCancel { background: #f1f5f9; color: #334155; }
  #cfOk { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="btnTree" aria-label="부품 목록"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <h1 id="title">PDF 3D 뷰어</h1>
    <button class="hbtn" id="btnOpen" aria-label="열기"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="hbtn" id="btnMenu" aria-label="메뉴"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg></button>
  </header>

  <div id="stage">
    <div id="view"></div>
    <div id="secpanel">
      <div class="seg" id="secaxis"><button data-a="0">X</button><button data-a="1">Y</button><button data-a="2">Z</button></div>
      <input type="range" id="secslider" min="0" max="1000" value="500">
      <button id="secflip" aria-label="방향 반전"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></button>
    </div>
    <div id="toast"></div>
    <div id="selbar">
      <span class="dot"></span>
      <div class="txt"><div class="t1" id="selname"></div><div class="t2" id="selinfo"></div></div>
      <button id="selzoom" aria-label="확대"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M11 8v6M8 11h6"/></svg></button>
      <button id="selclear" aria-label="선택 해제"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="welcome">
      <div class="logo"><img id="logoimg" alt="SFE"></div>
      <svg class="cube" viewBox="0 0 100 100" style="stroke:none">
        <polygon points="50,12 86,30 50,48 14,30" fill="#5eead4"/>
        <polygon points="14,30 50,48 50,88 14,70" fill="#2da096"/>
        <polygon points="50,48 86,30 86,70 50,88" fill="#146e6e"/>
      </svg>
      <h2>PDF 3D 뷰어</h2>
      <p>3D PDF 도면을 열어<br>회전·확대·단면·측정을 할 수 있습니다</p>
      <button class="open" id="btnOpen2"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>PDF 파일 열기</button>
      <small>U3D 형식 3D PDF · .u3d 파일 지원</small>
    </div>
    <div id="loading"><div><div class="spin"></div><div id="loadmsg">3D 모델을 읽는 중…</div></div></div>
  </div>

  <nav id="toolbar">
    <button class="tb" data-act="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>맞춤</button>
    <button class="tb" data-act="iso"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>등각</button>
    <button class="tb" data-act="front"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/><path d="M5 19l14-14" opacity=".0"/></svg>정면</button>
    <button class="tb" data-act="top"><svg viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4" opacity=".4"/></svg>윗면</button>
    <button class="tb" data-act="right"><svg viewBox="0 0 24 24"><path d="M8 4l10 4v12L8 16z"/></svg>우측</button>
    <button class="tb" data-act="views"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg>뷰 더보기</button>
    <span class="sep"></span>
    <button class="tb" data-act="mode" id="tbMode"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" fill="currentColor" fill-opacity=".25"/></svg><span id="modeLbl">음영</span></button>
    <button class="tb" data-act="section" id="tbSection"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M3 13l18-4" stroke="#e0413a"/></svg>단면</button>
    <button class="tb" data-act="measure" id="tbMeasure"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>거리 측정</button>
    <button class="tb" data-act="multi" id="tbMulti"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><path d="M13 7h4v4M7 13v4h4"/></svg>여러 개 선택</button>
    <span class="sep"></span>
    <button class="tb" data-act="isolate" id="tbIso"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/></svg>선택만 보기</button>
    <button class="tb" data-act="hide" id="tbHide"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.2 6.2C3.6 8 2 12 2 12s4 7 10 7a9.6 9.6 0 0 0 4.3-1"/></svg>숨기기</button>
    <button class="tb" data-act="showall"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M12 9v6M9 12h6" opacity=".0"/></svg>모두 보이기</button>
  </nav>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dhead"><b>부품 목록<small id="partcount"></small></b>
    <button id="drawerClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <input id="search" type="search" placeholder="부품 이름 검색…">
  <div id="searchinfo"></div>
  <div class="dactions"><button id="searchSelect" style="display:none">결과 모두 선택</button><button id="expandAll">모두 펼치기</button><button id="collapseAll">모두 접기</button><button id="treeShowAll">모두 보이기</button></div>
  <div id="tree"></div>
</aside>

<div id="sheet">
  <div class="grab"></div>
  <h3>보기 방향</h3>
  <div class="chips" id="viewchips">
    <button data-v="iso">등각</button><button data-v="front">정면</button><button data-v="back">뒷면</button>
    <button data-v="top">윗면</button><button data-v="bottom">아랫면</button><button data-v="left">좌측</button><button data-v="right">우측</button>
  </div>
  <h3>표시</h3>
  <div class="chips" id="modechips">
    <button data-m="0">음영</button><button data-m="1">음영 + 윤곽선</button><button data-m="2">와이어프레임</button><button data-m="3">X-ray</button>
  </div>
  <h3>모델 단위</h3>
  <div class="chips" id="unitchips">
    <button data-u="auto">자동</button><button data-u="m">m</button><button data-u="mm">mm</button><button data-u="in">inch</button>
  </div>
  <h3>기타</h3>
  <button class="item" id="miProj">투시 / 평행 투영 전환<span class="r" id="projLbl">투시</span></button>
  <button class="item" id="miBg">배경 밝게 / 어둡게</button>
  <button class="item" id="miHelp">조작 방법</button>
  <button class="item" id="miAbout">정보</button>
</div>

<div id="confirm">
  <div class="card">
    <h4 id="cfTitle"></h4>
    <p id="cfMsg"></p>
    <div class="btns"><button id="cfCancel">취소</button><button id="cfOk">확인</button></div>
  </div>
</div>

<input type="file" id="file" accept=".pdf,.u3d,application/pdf">
<script src="app.js"></script>
</body>
</html>
