name: PDF 3D Viewer - Android APK

on:
  push:
    paths:
      - "pdf3d-android/**"
      - ".github/workflows/pdf3d-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf3d-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "PDF3DViewer-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF3DViewer-apk
          path: pdf3d-android/PDF3DViewer-${{ github.run_number }}.apk

      # A GitHub Release makes the APK downloadable straight from the phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf3d-build-${{ github.run_number }}
          name: PDF 3D 뷰어 (빌드 ${{ github.run_number }})
          body: 휴대폰에서 아래 APK 파일을 눌러 받아 설치하세요.
          files: pdf3d-android/PDF3DViewer-${{ github.run_number }}.apk
